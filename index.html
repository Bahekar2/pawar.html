<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SHAKTI — Sambhajinagar</title>
  <body>
    <background-img src="https://assets.zyrosite.com/cdn-cgi/image/format=auto,w=768,fit=crop,q=95/YD0BjwkWGQfBvxr4/image-1-mnlJNXjQE6SyakNV.png" alt="">
</background-img>
  </body>
  

  <style>
    :root{
      --bg: linear-gradient(120deg,#0f172a,#0b7a6b 40%,#05233c);
      --card: rgba(255,255,255,0.08);
      --accent: #00e6a8;
      --muted: rgba(255,255,255,0.65);
      --maxw: 1100px;
      font-family: Inter, system-ui;
    }
    body{margin:0;background:var(--bg);color:#e6f3f1}
    .wrap{max-width:var(--maxw);margin:auto;padding:24px}

    header{display:flex;justify-content:space-between;align-items:center}
    nav a{color:var(--muted);margin:0 10px;text-decoration:none}
    nav a.active{color:white;font-weight:bold}

    .card{
      background:var(--card);
      padding:18px;
      border-radius:14px;
      margin-top:20px;
      backdrop-filter:blur(6px);
    }

    .product-gallery{
      margin-top:18px;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:16px;
    }

    .product-box{
      background:rgba(255,255,255,0.05);
      padding:12px;
      border-radius:12px;
      text-align:center;
      transition:0.2s;
      cursor:pointer;
    }
    .product-box:hover{transform:scale(1.04);}

    .product-box img{
      width:100%;
      height:180px;
      object-fit:contain;
      border-radius:8px;
    }

    .product-name{
      margin-top:6px;
      font-size:14px;
      opacity:0.9;
    }
    .div img{
      width:50%;
      height:auto;
      top: 20px;
      right: 30px;
      position: absolute;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <header>
      <div style="font-size:22px;font-weight:700">SHAKTI CHEMICALS</div>

      <nav id="nav">
        <a href="#/" data-route="/">Home</a>
        <a href="#/products" data-route="/products">Products</a>
        <a href="#/gallery" data-route="/gallery">Gallery</a>
        <a href="#/contact" data-route="/contact">Contact</a>
        <a href="#/location" data-route="/location">Location</a>
      </nav>
    </header>

    <main id="app"></main>

  </div>

<script>
/* ROUTER */
const routes = {
  "/": homeView,
  "/products": productsView,
  "/gallery": galleryView,
  "/contact": contactView,
  "/location": locationView
};

function setActive(path){
  document.querySelectorAll("nav a").forEach(a=>{
    a.classList.toggle("active", a.getAttribute("data-route")==path);
  });
}

function router(){
  const hash = location.hash.replace("#","");
  const path = hash || "/";
  setActive(path);
  document.getElementById("app").innerHTML = routes[path]() || notFoundView();
  enhanceImages();
}

window.addEventListener("hashchange", router);
window.addEventListener("load", router);

/* VIEWS */

function homeView(){
return `
  <div class="card">
    <h2>Quality crop protection — Sambhajinagar</h2>
    <p class="muted">ISO 9001:2015 certified pesticide formulations.</p>
  </div>
`;
}

function productsView(){
return `
  <div class="card">
    <h2>Products</h2>
    <div class="grid">
      <div class="product" onclick="copyText('Bifenthrin 10% EC')">Bifenthrin 10% EC</div>
      <div class="product" onclick="copyText('Imidacloprid 18.5%')">Imidacloprid 18.5%</div>
      <div class="product" onclick="copyText('Azoxystrobin 23% SC')">Azoxystrobin 23% SC</div>
    </div>
  </div>
`;
}

function galleryView(){
  // generate image names; use existing folder `shkati_images` and .png files
  const total = 132;
  const imgs = Array.from({ length: total }, (_, i) => `image${i+1}.png`);

  return `
  <div class="card">
    <h2>Product Image Gallery</h2>

    <div class="product-gallery">
      ${imgs.map(file => `
        <div class="product-box">
          <img src="shkati_images/${file}" alt="${file}" data-name="${file}">
    
        </div>
      `).join("")}
    </div>

  </div>
  `;
}


function contactView(){
return `
  <div class="card">
    <h2>Contact</h2>
    <p>Name: Sudhakar Pawar</p>
    <p>Phone: 7709809267</p>
    <p>phone: 8421379267</p>
  </div>
`;
}

function locationView(){
return `
  <div class="card">
    <h2>Location</h2>
    <iframe style="width:100%;height:320px;border-radius:10px"
      src="https://www.google.com/maps?q=Chh+Sambhajinagar&output=embed">
    </iframe>
  </div>
`;
}

function notFoundView(){
return `<div class="card"><h2>404 – Not Found</h2></div>`;
}

/* Helpers */
function copyText(t){
  navigator.clipboard.writeText(t);
  alert("Copied: "+t);
}

// Ensure images gracefully fall back when files are missing and enable lazy-loading
function enhanceImages(){
  const placeholderSVG = encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'><rect fill='#0b7a6b' width='100%' height='100%'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='22' fill='#fff'>Image not found</text></svg>");
  document.querySelectorAll('.product-gallery img').forEach(img=>{
    img.setAttribute('loading','lazy');
    if(!img.alt) img.alt = img.getAttribute('data-name') || 'Product image';
    img.onerror = function(){ this.onerror=null; this.src = 'data:image/svg+xml;utf8,' + placeholderSVG; };
  });
}
</script>

</body>
</html>
